name: prices

# 価格は日次、成分は月次。requirements.md §10.3
on:
  schedule:
    - cron: '0 21 * * *' # 06:00 JST
  workflow_dispatch:

permissions:
  contents: write
  issues: write # 失敗を Issue で知らせる

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 🔒 楽天の4つは Repository secrets ではなく Environment `pergram-dev` にある。
    #    この宣言が無いと secrets.* が空文字で注入され、認証情報が未設定として弾かれる。
    #    （2026-08-08〜10 の失敗はこれが原因）
    environment: pergram-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 🔒 4つとも要る。1つでも欠けると refresh_prices.js は実行前に停止する。
      #    特に RAKUTEN_AFFILIATE_ID は、無いと公開中の購入リンクを
      #    素の商品 URL で全上書きしてしまうため、警告では済ませていない。
      #    出所は scripts/rakuten_api.js の readCredentials ひとつ。
      - name: 価格を取り直す
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_APP_URL: ${{ secrets.RAKUTEN_APP_URL }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: node scripts/refresh_prices.js

      # 異常値が出たまま公開データを差し替えないよう、コミットの前に落とす
      - name: バリデーション
        run: npm run validate

      - name: コミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price_snapshots.json
          git diff --staged --quiet || git commit -m "chore(data): 価格スナップショットを更新"
          git push

      # 🔒 失敗を黙って見逃さない仕掛け。
      #    2026-08-17〜23 は楽天が API の版を廃止したことで7回連続で失敗したのに、
      #    誰も気づかないまま価格が8日間止まった。既定のメール通知だけでは足りない。
      #    Issue が既にあればコメントを足す。日数分の Issue を並べても読まれない。
      - name: 失敗を Issue で知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 価格の日次更新が失敗しています
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="$RUNNER_TEMP/issue-body.md"
          {
            echo "日次の価格更新が失敗しました。"
            echo
            echo "- 失敗したログ: $RUN_URL"
            echo
            echo "**まずログの「心当たり:」の行を読む。** scripts/rakuten_api.js の describeApiFailure が"
            echo "楽天の応答から原因の当たりを付けて出している。出ていない場合は下の表で切り分ける。"
            echo
            echo "楽天の応答は、原因が違っても揃って「認証情報が失効した」ように見える。**直す場所が違う。**"
            echo
            echo "| 応答 | 原因 | 直す場所 |"
            echo "|---|---|---|"
            echo "| 400 API Configuration not found | API の版（エンドポイント末尾の日付）が廃止された。認証もリファラ審査も通ったうえで返る | scripts/rakuten_api.js の ENDPOINT の版を差し替える（2026-08-17 に 20220601 が廃止された前例あり） |"
            echo "| 403 HTTP_REFERRER_NOT_ALLOWED | Referer に載せた RAKUTEN_APP_URL が、楽天デベロッパー画面に登録したアプリ URL と一致していない。**値は届いている** | 両者を突き合わせる。**ドメインを移したときは GitHub 側の更新漏れを最初に疑う**（2026-08-24 の pergram.site への移行で、Environment pergram-dev の RAKUTEN_APP_URL だけが旧ドメインのまま残り、12日間止まった） |"
            echo "| 403 REQUEST_CONTEXT_BODY_HTTP_REFERRER_MISSING | Referer が送られていない。上の NOT_ALLOWED とは別 | RAKUTEN_APP_URL が空でないか。Environment pergram-dev の宣言が workflow から消えていないか |"
            echo "| 未設定: RAKUTEN_... | Environment pergram-dev の secret が読めていない | workflow の environment: pergram-dev の宣言と、secret 4つの存在を確認する |"
            echo
            echo "🔒 秘密の値をこの Issue やログに貼らないこと。突き合わせは楽天デベロッパー画面と"
            echo "GitHub の設定画面の上で行う。"
            echo
            echo "復旧したらこの Issue を閉じてください。"
          } > "$BODY"
          NUMBER=$(gh issue list --state open --limit 100 --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file "$BODY"
          else
            gh issue create --title "$TITLE" --body-file "$BODY"
          fi
