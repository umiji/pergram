name: prices

# 価格は日次、成分は月次。requirements.md §10.3
on:
  schedule:
    - cron: '0 21 * * *' # 06:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 価格を取り直す
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
        run: node scripts/refresh_prices.js

      - name: バリデーション
        run: npm run validate

      - name: コミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price_snapshots.json
          git diff --staged --quiet || git commit -m "chore(data): 価格スナップショットを更新"
          git push
